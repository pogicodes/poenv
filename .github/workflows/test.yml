name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR replaces a run that's still going.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      # The real loaders poenv's env file block is checked against (tests/loaders.rs).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r tests/loaders/requirements.txt
      - run: npm ci --prefix tests/loaders
      # Spring Boot's application.properties loader and what it needs, for tests/loaders.rs.
      - name: Spring Boot jars
        shell: bash
        run: |
          mkdir -p tests/loaders/jars
          for jar in boot/spring-boot/3.2.4/spring-boot-3.2.4.jar spring-core/6.1.5/spring-core-6.1.5.jar spring-jcl/6.1.5/spring-jcl-6.1.5.jar; do
            curl -fsSL -o "tests/loaders/jars/${jar##*/}" "https://repo1.maven.org/maven2/org/springframework/$jar"
          done
      - run: cargo test --locked
        env:
          POENV_TEST_LOADERS: "1"
          POENV_TEST_PYTHON: python

  # The real installers against the real latest release (catches GitHub redirect caching, PATH handling…).
  installers:
    strategy:
      fail-fast: false
      matrix:
        # install.sh is the same on macOS and Linux; the release smoke test runs it on macOS.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # Before the first release there's nothing to install: skip, but still fail on any other gh error.
      - name: Latest release tag
        shell: bash
        run: |
          if ! tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> gh-error.txt); then
            if grep -q "release not found" gh-error.txt; then
              echo "::notice::No release yet, so the installers have nothing to install. Skipped."
              exit 0
            fi
            cat gh-error.txt
            exit 1
          fi
          echo "LATEST=${tag#v}" >> "$GITHUB_ENV"
      - name: install.sh
        if: runner.os != 'Windows' && env.LATEST != ''
        run: |
          sh site/install.sh --yes --dir "$RUNNER_TEMP/bin" --no-modify-path
          [ "$("$RUNNER_TEMP/bin/poenv" --version)" = "$LATEST" ]
      - name: install.ps1
        if: runner.os == 'Windows' && env.LATEST != ''
        shell: pwsh
        run: |
          $env:POENV_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./site/install.ps1
          $v = & "$env:RUNNER_TEMP\bin\poenv.exe" --version
          if ($v -ne $env:LATEST) { throw "installed $v, expected $env:LATEST" }
